<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 185" width="760" height="185"
     font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="185" fill="#0B1B2B"/>

  <!-- faint guide ticks linking each letter to its word -->
  <g stroke="#2A3E52" stroke-width="1">
    <line x1="127.5" y1="98" x2="127.5" y2="120"/>
    <line x1="274"   y1="98" x2="274"   y2="120"/>
    <line x1="384"   y1="98" x2="384"   y2="120"/>
    <line x1="530.5" y1="98" x2="530.5" y2="120"/>
    <line x1="655"   y1="98" x2="655"   y2="120"/>
  </g>

  <!-- big letters -->
  <g fill="#F2F6FA" font-size="64" font-weight="800" text-anchor="middle">
    <text x="127.5" y="85">G</text>
    <text x="274"   y="85">R</text>
    <text x="384"   y="85">I</text>
    <text x="530.5" y="85">P</text>
    <text x="655"   y="85">S</text>
  </g>

  <!-- expansion: initial bold + accent, remainder muted -->
  <g font-size="20" letter-spacing="1.5" text-anchor="middle">
    <text x="127.5" y="145"><tspan font-weight="800" fill="#4FD1A5">G</tspan><tspan fill="#A8B6C4">EOSPATIAL</tspan></text>
    <text x="274"   y="145"><tspan font-weight="800" fill="#4FD1A5">R</tspan><tspan fill="#A8B6C4">ESEARCH</tspan></text>
    <text x="384"   y="145"><tspan font-weight="800" fill="#4FD1A5">I</tspan><tspan fill="#A8B6C4">NDEX</tspan></text>
    <text x="446.5" y="145" font-size="15" font-style="italic" fill="#7C8B9A" letter-spacing="0.5">of</text>
    <text x="530.5" y="145"><tspan font-weight="800" fill="#4FD1A5">P</tspan><tspan fill="#A8B6C4">AKISTAN</tspan></text>
    <text x="655"   y="145"><tspan font-weight="800" fill="#4FD1A5">S</tspan><tspan fill="#A8B6C4">TUDIES</tspan></text>
  </g>
</svg>
